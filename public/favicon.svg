<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Gold Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9E29D" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA7C11" />
      <stop offset="100%" stop-color="#F3DC87" />
    </linearGradient>

    <!-- Emerald Gradients -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="40%" stop-color="#044E3D" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>

    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFBEB" stop-opacity="1" />
      <stop offset="50%" stop-color="#FBBF24" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Outer Decorative Ring -->
  <circle cx="256" cy="256" r="236" stroke="url(#goldGrad)" stroke-width="8" fill="none" />
  <circle cx="256" cy="256" r="222" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="6 4" fill="none" />
  <circle cx="256" cy="256" r="206" stroke="url(#goldGrad)" stroke-width="2" fill="none" />

  <!-- Rays from dome -->
  <g stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.75">
    <line x1="256" y1="120" x2="256" y2="85" />
    <line x1="200" y1="135" x2="175" y2="105" />
    <line x1="312" y1="135" x2="337" y2="105" />
    <line x1="150" y1="170" x2="120" y2="145" />
    <line x1="362" y1="170" x2="392" y2="145" />
    <line x1="120" y1="220" x2="90" y2="205" />
    <line x1="392" y1="220" x2="422" y2="205" />
  </g>

  <!-- Crescent & Star at the very top -->
  <g transform="translate(256, 76)">
    <!-- Crescent -->
    <path d="M-1,-26 A18,18 0 1,0 16,3 A14,14 0 1,1 -1,-26 Z" fill="#044E3D" stroke="url(#goldGrad)" stroke-width="1.5" />
    <!-- Star inside Crescent -->
    <path d="M5,-12 L7,-7 L12,-7 L8,-3 L10,2 L5,-1 L1,2 L2,-3 L-2,-7 L3,-7 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Main Mosque Dome -->
  <path d="M256,128 C305,170 338,205 348,270 C348,272 164,272 164,270 C174,205 207,170 256,128 Z" fill="url(#emeraldGrad)" stroke="url(#goldGrad)" stroke-width="4" />
  
  <!-- Dome Architectural Inner Curves & Arches -->
  <path d="M256,145 C288,180 314,215 322,270" stroke="url(#goldGrad)" stroke-width="2.5" fill="none" opacity="0.85" />
  <path d="M256,145 C224,180 198,215 190,270" stroke="url(#goldGrad)" stroke-width="2.5" fill="none" opacity="0.85" />
  <path d="M256,160 C274,195 290,228 296,270" stroke="url(#goldGrad)" stroke-width="2" fill="none" opacity="0.7" />
  <path d="M256,160 C238,195 222,228 216,270" stroke="url(#goldGrad)" stroke-width="2" fill="none" opacity="0.7" />

  <!-- Center Glowing Star in Dome -->
  <circle cx="256" cy="195" r="14" fill="url(#starGlow)" />
  <path d="M256,182 L259,192 L269,195 L259,198 L256,208 L253,198 L243,195 L253,192 Z" fill="#FFFFFF" />

  <!-- Mini Iconic Windows in Dome Base -->
  <g fill="url(#goldGrad)" opacity="0.95" transform="translate(0, 10)">
    <!-- Quran Book Icon (Left) -->
    <path d="M228,236 C225,233 220,233 216,236 L216,248 C220,246 225,246 228,248 Z" />
    <path d="M228,236 C231,233 236,233 240,236 L240,248 C236,246 231,246 228,248 Z" />
    
    <!-- Mosque Arch (Center) -->
    <path d="M251,250 L251,238 C251,233 261,233 261,238 L261,250 Z" />
    <circle cx="256" cy="233" r="3" />

    <!-- Kaaba / Minaret / Star Grid (Right) -->
    <rect x="272" y="235" width="5" height="5" rx="1" />
    <rect x="280" y="235" width="5" height="5" rx="1" />
    <rect x="272" y="243" width="5" height="5" rx="1" />
    <rect x="280" y="243" width="5" height="5" rx="1" />
  </g>

  <!-- Arabic Typography "نور مسلم" with crisp golden outline -->
  <g transform="translate(256, 335)" text-anchor="middle">
    <!-- Drop Shadow / Stroke for readability -->
    <text font-family="'Amiri', 'Scheherazade New', 'Traditional Arabic', serif" font-size="76" font-weight="bold" fill="#044E3D" stroke="#044E3D" stroke-width="8" stroke-linejoin="round" x="0" y="0">
      نُور مُسْلِم
    </text>
    <text font-family="'Amiri', 'Scheherazade New', 'Traditional Arabic', serif" font-size="76" font-weight="bold" fill="#FFFFFF" stroke="#022C22" stroke-width="2" x="0" y="0">
      نُور مُسْلِم
    </text>
  </g>

  <!-- Latin Subtitle "NURMUSLIM" -->
  <text x="256" y="380" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="900" letter-spacing="4" fill="url(#goldGrad)" text-anchor="middle">
    NURMUSLIM
  </text>

  <!-- Small Subtitle "SUPERAPP ISLAMI" -->
  <text x="256" y="406" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" letter-spacing="3" fill="#044E3D" text-anchor="middle">
    SUPERAPP ISLAMI
  </text>

  <!-- Bottom Islamic Geometric Star Pattern -->
  <g stroke="url(#goldGrad)" stroke-width="2.5" fill="none" opacity="0.8" transform="translate(256, 440)">
    <path d="M-40,0 L-20,-15 L0,0 L20,-15 L40,0 L20,15 L0,0 L-20,15 Z" />
    <circle cx="0" cy="0" r="4" fill="url(#goldGrad)" />
    <circle cx="-55" cy="0" r="3" fill="url(#goldGrad)" />
    <circle cx="55" cy="0" r="3" fill="url(#goldGrad)" />
  </g>
</svg>
